<!doctype html>
<html lang="fr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Règlement — OASYS RP</title>
  <meta name="description" content="Règlement officiel du serveur FiveM OASYS RP.">
  <meta name="theme-color" content="#04080f">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="config/config.js" defer></script>
  <!-- Le texte du règlement se modifie dans config/reglement.js -->
  <script src="config/reglement.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="reglement">

  <header data-header></header>

  <main>
    <section class="page-hero">
      <div class="page-hero__bg"><img src="assets/img/police.webp" alt=""></div>
      <div class="wrap intro">
        <p class="crumb"><a href="index.html">Accueil</a><i>/</i>Règlement</p>
        <p class="eyebrow">Règlement</p>
        <h1 class="title-xl">Règlement <em>OASYS RP</em></h1>
        <p class="lead">Les règles qui garantissent un roleplay de qualité pour tous. Leur lecture est obligatoire avant de jouer.</p>
        <div class="rules-meta">
          <span>Mise à jour : <b data-rules-date></b></span>
          <span><b data-rules-count>00</b> parties</span>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap rules-layout">
        <aside class="toc" aria-label="Sommaire du règlement">
          <label class="sr-only" for="rules-search">Rechercher dans le règlement</label>
          <input class="toc__search" id="rules-search" type="search" placeholder="Rechercher une règle…" data-rules-search autocomplete="off">
          <p class="toc__title">Sommaire</p>
          <ol data-toc></ol>
        </aside>

        <article class="rules" data-rules>
          <noscript><p>Active JavaScript pour afficher le règlement.</p></noscript>
        </article>
      </div>
    </section>
  </main>

  <footer data-footer></footer>
</body>
</html>
